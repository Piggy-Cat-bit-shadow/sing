version: "2"
run:
  go: "1.24"
linters:
  default: none
  enable:
    - ineffassign
    - staticcheck
    - unused
    # paralleltest is deliberately not enabled: many of these tests use real loopback
    # sockets, shared process-wide hooks and timers, and adding t.Parallel() mechanically
    # would create cross-test interference rather than coverage.
    # modernize is deliberately not enabled: its style rewrites are not required for this
    # fork and would touch validated network/splice tests without adding behavior.
  settings:
    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    paths:
      - common/json/internal/contextjson
      - contrab
formatters:
  enable:
    - gci
  # gofumpt is deliberately not enabled: it conflicts with the required gofmt splice gate on
  # these Go 1.25 sources (alignment-only differences); gofmt remains the formatting authority.
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - common/json/internal/contextjson